[pytest]
addopts =
    -p no:langsmith
    --strict-markers
testpaths =
    backend/tests
    kattappa_native/tests
    kattappa_data_engine/tests
    kattappa_runtime/resource_governor
norecursedirs =
    bin
    archive
    .git
    .hypothesis
    ai_system_env
    mutants
filterwarnings =
    ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning:chromadb.types
markers =
    unit: deterministic isolated tests
    integration: subsystem interaction tests
    safety: permission, denial-path, verification, and recovery tests
    performance: relative resource and latency checks
    evaluation: AI quality benchmark scenarios
    slow: tests unsuitable for the fast pull-request lane
    network: tests requiring network access or network simulation
    hardware: tests requiring or emulating hardware-specific behavior
    mutation: tests used by the safety mutation gate
