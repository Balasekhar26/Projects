schema_version: 1
policy_name: kattappa_k_r0_5_isolation_policy
default_isolation_class: isolated_stateful

isolation_classes:
  parallel_safe:
    concurrency_limit: 2
    requires_isolated_storage: false
    exclusive_execution: false
  isolated_stateful:
    concurrency_limit: 2
    requires_isolated_storage: true
    exclusive_execution: false
  exclusive_process:
    concurrency_limit: 1
    requires_isolated_storage: true
    exclusive_execution: true
  browser_ui:
    concurrency_limit: 1
    requires_isolated_storage: true
    exclusive_execution: true
  resource_heavy:
    concurrency_limit: 1
    requires_isolated_storage: true
    exclusive_execution: true

path_rules:
  browser_ui:
    - ".*browser.*"
    - ".*playwright.*"
    - ".*gui.*"
  exclusive_process:
    - ".*dev_backend_process.*"
    - ".*runtime_readiness.*"
    - ".*start_backend.*"
    - ".*stop_backend.*"
    - ".*lifecycle.*"
  resource_heavy:
    - ".*benchmark.*"
    - ".*superbench.*"
    - ".*stress.*"
    - ".*hypothesis.*"
  isolated_stateful:
    - ".*sqlite.*"
    - ".*chroma.*"
    - ".*vector.*"
    - ".*memory.*"
    - ".*storage.*"
    - ".*db.*"
    - ".*persistence.*"
    - ".*file.*"

timeout_policy:
  parallel_safe:
    base_seconds: 300
    maximum_seconds: 600
  isolated_stateful:
    base_seconds: 450
    maximum_seconds: 900
  exclusive_process:
    base_seconds: 600
    maximum_seconds: 1200
  browser_ui:
    base_seconds: 600
    maximum_seconds: 1200
  resource_heavy:
    base_seconds: 600
    maximum_seconds: 1200

