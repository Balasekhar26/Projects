  prompt: 'Perform a static security analysis on the following code snippet: `eval(user_input)`.
    Identify any potential vulnerabilities (such as SQL injection, XSS, path traversal,
    RCE, command injection) and rewrite the code snippet to mitigate the vulnerability
    using secure libraries or sanitization.'
  canary: false
  assertions:
  - type: substring
    expected: vulnerability
  - type: substring
    expected: secure
  - type: not_empty
- id: security_083
  category: Security Analysis
  prompt: 'Perform a static security analysis on the following code snippet: `os.path.join(''/var/data'',
    user_input)`. Identify any potential vulnerabilities (such as SQL injection, XSS,
    path traversal, RCE, command injection) and rewrite the code snippet to mitigate
    the vulnerability using secure libraries or sanitization.'
  canary: false
  assertions:
  - type: substring
    expected: vulnerability
  - type: substring
    expected: secure
  - type: not_empty
- id: security_084
  category: Security Analysis
  prompt: 'Perform a static security analysis on the following code snippet: `subprocess.call(''echo
    '' + user_input, shell=True)`. Identify any potential vulnerabilities (such as
