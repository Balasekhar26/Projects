name: Kattappa CI/CD Workflows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  execution-stabilization:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kattappa
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: kattappa/requirements-dev.txt
    - name: Install stabilization dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Build integrity
      run: |
        python -m compileall -q backend/core/action evaluation
        python -m mypy backend/core/action evaluation/action_runtime_benchmark.py evaluation/ci_health_report.py scripts/collect_pytest_nodeids.py
        python -m ruff check backend/core/action \
          backend/tests/test_action_runtime.py \
          backend/tests/test_action_properties.py \
          backend/tests/test_action_integration.py \
          backend/tests/test_action_benchmark.py \
          backend/tests/test_action_boundaries.py \
          backend/tests/test_ci_health_report.py \
          evaluation/action_runtime_benchmark.py \
          evaluation/ci_health_report.py \
          scripts/collect_pytest_nodeids.py
        python -m black --check \
          backend/core/action/__init__.py \
          backend/core/action/benchmark.py \
          backend/core/action/capabilities.py \
          backend/core/action/file_executor.py \
          backend/core/action/interfaces.py \
          backend/core/action/models.py \
          backend/core/action/recovery.py \
          backend/core/action/registry.py \
          backend/core/action/resources.py \
          backend/core/action/shell_executor.py \
          backend/core/action/verifier.py \
          backend/tests/test_action_runtime.py \
          backend/tests/test_action_properties.py \
          backend/tests/test_action_integration.py \
          backend/tests/test_action_benchmark.py \
          backend/tests/test_action_boundaries.py \
          backend/tests/test_ci_health_report.py \
          evaluation/action_runtime_benchmark.py \
          evaluation/ci_health_report.py \
          scripts/collect_pytest_nodeids.py
    - name: Unit, property, and integration tests
      run: |
        mkdir -p artifacts/execution-stabilization
        python -m coverage run --branch -m pytest \
          backend/tests/test_action.py \
          backend/tests/test_action_runtime.py \
          backend/tests/test_action_properties.py \
          backend/tests/test_action_integration.py \
          backend/tests/test_action_benchmark.py \
          backend/tests/test_action_boundaries.py \
          backend/tests/test_ci_health_report.py \
          --junitxml=artifacts/execution-stabilization/junit.xml -q
        python -m coverage json -o artifacts/execution-stabilization/coverage.json
    - name: Safety mutation tests
      run: |
        mutmut run
        mutmut export-cicd-stats
        cp mutants/mutmut-cicd-stats.json artifacts/execution-stabilization/mutation.json
    - name: Restore rolling benchmark history
      uses: actions/cache@v4
      with:
        path: kattappa/artifacts/action-benchmark-history.json
        key: ${{ runner.os }}-action-benchmark-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-action-benchmark-
    - name: Action Runtime benchmark
      run: |
        python -m evaluation.action_runtime_benchmark \
          --output artifacts/execution-stabilization/benchmark.json \
          --history artifacts/action-benchmark-history.json \
          --tolerance 0.15 \
          --memory-ceiling-mb 8192 \
          --record
    - name: Publish health report
      run: |
        python -m evaluation.ci_health_report \
          --junit artifacts/execution-stabilization/junit.xml \
          --mutation artifacts/execution-stabilization/mutation.json \
          --benchmark artifacts/execution-stabilization/benchmark.json \
          --coverage artifacts/execution-stabilization/coverage.json \
          --json-output artifacts/execution-stabilization/health.json \
          --markdown-output artifacts/execution-stabilization/health.md \
          --strict
        cat artifacts/execution-stabilization/health.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload stabilization evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-stabilization-health
        path: kattappa/artifacts/execution-stabilization/

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 kattappa/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 kattappa/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f kattappa/requirements.txt ]; then pip install -r kattappa/requirements.txt; fi
        pip install pytest psutil sentencepiece
    - name: Run unit tests with pytest
      run: |
        PYTHONPATH=kattappa pytest kattappa/tests/

  training-smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f kattappa/requirements.txt ]; then pip install -r kattappa/requirements.txt; fi
        pip install psutil sentencepiece torch
    - name: Run training smoke test
      run: |
        PYTHONPATH=kattappa python3 kattappa/kattappa_native/training/trainer.py \
          --steps 10 \
          --batch 1 \
          --seq-len 128 \
          --no-monitor \
          --no-eval \
          --checkpoint-dir kattappa/kattappa_native/checkpoints/smoke \
          --resume false \
          --timeline-log-path kattappa/logs/smoke/timeline.csv \
          --timing-log-path kattappa/logs/smoke/timing.jsonl

  regression-scorecards:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f kattappa/requirements.txt ]; then pip install -r kattappa/requirements.txt; fi
        pip install psutil sentencepiece torch
    - name: Run validation and regression checks (Mock checkpoint)
      run: |
        mkdir -p kattappa/kattappa_native/checkpoints/ci/
        # Create a mock checkpoint file for testing
        python3 -c "import torch; torch.save({'model_state_dict': {}}, 'kattappa/kattappa_native/checkpoints/ci/checkpoint_step_0000000.pt')"
        PYTHONPATH=kattappa python3 kattappa/run_eval.py --checkpoint kattappa/kattappa_native/checkpoints/ci/checkpoint_step_0000000.pt --device cpu
